    <path d="M31 54.2 L31 59.4" stroke="#6e9a78" stroke-width="1" stroke-linecap="round"/>
  </g>
  </g>
  <text x="84" y="38" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.9" fill="#1c2824">Saltbush</text>
  <text x="85" y="60" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="-0.1" fill="#5c6b64">Dog Grooming</text>
